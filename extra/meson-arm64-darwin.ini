# Meson machine file for arm64 / Apple Silicon.
# Used as --native-file when building natively on arm64,
# or as --cross-file when cross-compiling from x86_64.
# If MACOSX_DEPLOYMENT_TARGET changes from 11.0, update this file.

[binaries]
c         = 'clang'
cpp       = 'clang++'
objc      = 'clang'
ar        = 'ar'
strip     = 'strip'
pkg-config = 'pkg-config'

[built-in options]
c_args        = ['-arch', 'arm64', '-mmacosx-version-min=11.0']
c_link_args   = ['-arch', 'arm64', '-mmacosx-version-min=11.0']
cpp_args      = ['-arch', 'arm64', '-mmacosx-version-min=11.0']
cpp_link_args = ['-arch', 'arm64', '-mmacosx-version-min=11.0']
objc_args      = ['-arch', 'arm64', '-mmacosx-version-min=11.0']
objc_link_args = ['-arch', 'arm64', '-mmacosx-version-min=11.0']

[host_machine]
system     = 'darwin'
cpu_family = 'aarch64'
cpu        = 'aarch64'
endian     = 'little'
