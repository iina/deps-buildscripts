name: Publish Release

on:
  push:
    tags:
      - 'iina-*-release'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish packaged artifacts to release
    runs-on: macos-26
    steps:
      - name: Checkout to the last tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve target tag
        id: resolve_tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
          else
            tag=$(git for-each-ref --sort=-creatordate --format='%(refname:short)' 'refs/tags/iina-*-release' | head -n1)
            if [ -z "$tag" ]; then
              echo "::error::No tags matching 'iina-*-release' found in the repo."
              exit 1
            fi
          fi
          sha=$(git rev-list -n1 "$tag")
          echo "Resolved tag $tag -> $sha"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Find matching build run
        id: find_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ steps.resolve_tag.outputs.sha }}"
          run_id=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?head_sha=${sha}&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "::error::No successful 'Build IINA Dependencies' run found for commit ${sha} (tag ${{ steps.resolve_tag.outputs.tag }}). Trigger build.yml via workflow_dispatch for that commit, wait for it to finish, then re-run this workflow."
            exit 1
          fi
          echo "Found build run $run_id for $sha"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download packaged artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          run_id="${{ steps.find_run.outputs.run_id }}"
          gh api "repos/${{ github.repository }}/actions/runs/${run_id}/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | startswith("iina-deps-")) | "\(.id) \(.name)"' |
          while read -r id name; do
            echo "Downloading artifact ${name} (id=${id})"
            gh api "repos/${{ github.repository }}/actions/artifacts/${id}/zip" > "release/${name}.zip"
          done
          ls -la release/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.resolve_tag.outputs.tag }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" release/*.zip --repo "${{ github.repository }}" --clobber
          else
            gh release create "$tag" release/*.zip --repo "${{ github.repository }}" --title "$tag" --generate-notes
          fi
