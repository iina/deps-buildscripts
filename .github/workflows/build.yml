name: Build IINA Dependencies

on:
  workflow_dispatch:
  push:
    paths:
      - 'versions.env'
      - 'config.env'
      - 'build.sh'
      - 'scripts/**'
      - 'patches/**'
      - '.github/workflows/build.yml'

env:
  HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

jobs:
  # ---------------------------------------------------------------------------
  # Build on Apple Silicon (arm64)
  # ---------------------------------------------------------------------------
  build-arm64:
    name: Build (arm64)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          brew install nasm meson autoconf automake libtool

      - name: Build dependencies
        run: bash build.sh arm64

      - name: Verify arm64 libraries
        run: |
          shopt -s nullglob
          dylibs=(install/arm64/lib/*.dylib)
          if [ ${#dylibs[@]} -eq 0 ]; then
            echo "ERROR: No dylibs found in install/arm64/lib/" && exit 1
          fi
          for f in "${dylibs[@]}"; do
            [ -L "$f" ] && continue
            echo "--- $(basename "$f") ---"
            lipo -info "$f"
            lipo -info "$f" | grep -q "arm64" || { echo "FAIL: missing arm64"; exit 1; }
            vtool -show-build "$f"
            vtool -show-build "$f" | grep -q "minos 11.0" || { echo "FAIL: wrong minos in $(basename "$f")"; exit 1; }
          done

      - name: Stage arm64 artifacts
        run: |
          mkdir -p artifacts/lib artifacts/include
          for f in install/arm64/lib/*.dylib; do
            [ -L "$f" ] && continue
            cp "$f" artifacts/lib/
          done
          cp -r install/arm64/include/mpv artifacts/include/ 2>/dev/null || true
          for d in install/arm64/include/libav* \
                   install/arm64/include/libsw* \
                   install/arm64/include/libpost*; do
            [ -d "$d" ] && cp -r "$d" artifacts/include/
          done

      - name: Upload arm64 artifacts
        uses: actions/upload-artifact@v5
        with:
          name: deps-arm64
          path: artifacts/

  # ---------------------------------------------------------------------------
  # Build on Intel (x86_64)
  # ---------------------------------------------------------------------------
  build-x86_64:
    name: Build (x86_64)
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          brew install nasm meson autoconf automake libtool

      - name: Build dependencies
        run: bash build.sh x86_64

      - name: Verify x86_64 libraries
        run: |
          shopt -s nullglob
          dylibs=(install/x86_64/lib/*.dylib)
          if [ ${#dylibs[@]} -eq 0 ]; then
            echo "ERROR: No dylibs found in install/x86_64/lib/" && exit 1
          fi
          for f in "${dylibs[@]}"; do
            [ -L "$f" ] && continue
            echo "--- $(basename "$f") ---"
            lipo -info "$f"
            lipo -info "$f" | grep -q "x86_64" || { echo "FAIL: missing x86_64"; exit 1; }
            vtool -show-build "$f"
            vtool -show-build "$f" | grep -q "minos 11.0" || { echo "FAIL: wrong minos in $(basename "$f")"; exit 1; }
          done

      - name: Stage x86_64 artifacts
        run: |
          mkdir -p artifacts/lib artifacts/include
          for f in install/x86_64/lib/*.dylib; do
            [ -L "$f" ] && continue
            cp "$f" artifacts/lib/
          done
          cp -r install/x86_64/include/mpv artifacts/include/ 2>/dev/null || true
          for d in install/x86_64/include/libav* \
                   install/x86_64/include/libsw* \
                   install/x86_64/include/libpost*; do
            [ -d "$d" ] && cp -r "$d" artifacts/include/
          done

      - name: Upload x86_64 artifacts
        uses: actions/upload-artifact@v5
        with:
          name: deps-x86_64
          path: artifacts/

  # ---------------------------------------------------------------------------
  # Combine into universal binaries
  # ---------------------------------------------------------------------------
  create-universal:
    name: Create Universal Binaries
    needs: [build-arm64, build-x86_64]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v5
        with:
          name: deps-arm64
          path: install/arm64/

      - name: Download x86_64 artifacts
        uses: actions/download-artifact@v5
        with:
          name: deps-x86_64
          path: install/x86_64/

      - name: Create universal binaries
        run: bash scripts/create-universal.sh

      - name: Fix install names
        run: bash scripts/fix-install-names.sh

      - name: Verify universal binaries
        run: |
          shopt -s nullglob
          for f in output/lib/*.dylib; do
            [ -L "$f" ] && continue
            echo "--- $(basename "$f") ---"
            lipo -info "$f"
            lipo -info "$f" | grep -q "arm64"  || { echo "FAIL: missing arm64";  exit 1; }
            lipo -info "$f" | grep -q "x86_64" || { echo "FAIL: missing x86_64"; exit 1; }
            vtool -show-build "$f"
            vtool -show-build "$f" | grep -q "minos 11.0" || { echo "FAIL: wrong minos in $(basename "$f")"; exit 1; }
          done

      - name: Copy headers to output
        run: |
          mkdir -p output/include
          cp -r install/arm64/include/mpv output/include/ 2>/dev/null || true
          for d in install/arm64/include/libav* \
                   install/arm64/include/libsw* \
                   install/arm64/include/libpost*; do
            [ -d "$d" ] && cp -r "$d" output/include/
          done

      - name: Package
        run: tar czf iina-deps-universal.tar.gz -C output .

      - name: Upload universal artifact
        uses: actions/upload-artifact@v5
        with:
          name: iina-deps-universal
          path: iina-deps-universal.tar.gz
